name: DevSecOps Automated Pipeline

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: campus-ledger
  CONTAINER_NAME: campus-ledger-prod

jobs:
  security-scans:
    name: Run DevSecOps Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy Infrastructure Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          hide-progress: false
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: Run Gitleaks Secret Detection Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --verbose --redact

  build-and-deploy:
    name: Build Image and Deploy to Cloud
    needs: security-scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Lowercase Image Tag
        id: image
        run: |
          IMAGE_PATH="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest"
          IMAGE_PATH_LOWER=$(echo "$IMAGE_PATH" | tr '[:upper:]' '[:lower:]')
          echo "tag=$IMAGE_PATH_LOWER" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tag }}

      - name: SSH Remote Deployment to AWS Cloud Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            sudo apt-get update -y
            sudo apt-get install -y docker.io
            sudo systemctl enable docker
            sudo systemctl start docker

            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            sudo docker stop employee-portal-prod || true
            sudo docker rm employee-portal-prod || true

            sudo docker stop ${{ env.CONTAINER_NAME }} || true
            sudo docker rm ${{ env.CONTAINER_NAME }} || true

            sudo docker pull ${{ steps.image.outputs.tag }}

            sudo docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              -p 5000:5000 \
              -e DB_HOST="${{ secrets.DB_HOST }}" \
              -e DB_USER="admin" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e DB_NAME="campus_ledger" \
              -e DB_PORT="3306" \
              -e SECRET_KEY="${{ secrets.SECRET_KEY }}" \
              ${{ steps.image.outputs.tag }}

            sleep 5

            sudo docker ps
            sudo docker logs ${{ env.CONTAINER_NAME }} --tail 50